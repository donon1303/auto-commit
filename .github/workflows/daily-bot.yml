name: Daily Repository Bot

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate random number of files
        run: python generate_daily.py

      - name: Create individual commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in $(git ls-files --others --exclude-standard daily/); do
            git add "$file"
            git commit -m "Daily update: $(basename "$file" .md)"
          done

          git push
